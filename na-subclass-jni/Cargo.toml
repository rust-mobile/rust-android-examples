[package]
name = "na-subclass-jni"
version = "0.1.0"
edition = "2021"

[dependencies]
log = "0.4"
android_logger = "0.11.0"
android-activity = { version = "0.6", features = ["native-activity"] }
ndk = "0.9"
ndk-sys = "0.6"
jni = "0.22"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lib]
#name="na_subclass_jni"
crate-type = ["cdylib"]
