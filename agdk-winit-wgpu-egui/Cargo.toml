[package]
name = "agdk-winit-wgpu-egui"
version = "0.1.0"
edition = "2021"

[dependencies]
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = [
    "fmt",
    "env-filter",
    "tracing-log",
] }
winit = { version = "0.30", features = ["android-game-activity"] }
wgpu = "27"
pollster = "0.2"
raw-window-handle = "0.6.0"
bytemuck = "1.14"

egui = { version = "0.33" }
egui-wgpu = { version = "0.33" }
egui-winit = { version = "0.33", default-features = false, features = [
    "wayland",
    "android-game-activity",
    "links",
] }
egui_demo_lib = "0.33"

[target.'cfg(target_os = "android")'.dependencies]
paranoid-android = "0.2"
tracing-log = "0.2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1"
tracing-web = "0.1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3.92", features = [
    "Window",
    "Document",
    "HtmlElement",
    "Text",
] }

[features]
default = []
_bin = []
desktop = ["_bin"]
web = ["_bin", "wgpu/webgl"]

[lib]
name = "main"
crate-type = ["cdylib"]
