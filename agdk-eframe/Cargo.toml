[package]
name = "agdk-eframe"
version = "0.1.0"
edition = "2021"
resolver = "2"

[dependencies]
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = [
    "fmt",
    "env-filter",
    "tracing-log",
] }
winit = { version = "0.30", features = ["android-game-activity"] }
pollster = "0.2"
egui = "0.33"
eframe = { version = "0.33", features = ["wgpu", "android-game-activity"] }
egui_demo_lib = "0.33"

[target.'cfg(target_os = "android")'.dependencies]
paranoid-android = "0.2"
tracing-log = "0.2"

[features]
default = []
desktop = []

[lib]
name = "main"
crate-type = ["cdylib"]

[[bin]]
path = "src/lib.rs"
name = "agdk-eframe"
required-features = ["desktop"]
